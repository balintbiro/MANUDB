<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Flask App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('manudb') }}" class="{% if request.path == '/manudb' or request.path == '/' %}active{% endif %}">MANUDB</a>
        <a href="{{ url_for('export') }}" class="{% if request.path == '/export' %}active{% endif %}">Export</a>
        <a href="{{ url_for('visualize') }}" class="{% if request.path == '/visualize' %}active{% endif %}">Visualize</a>
    </nav>    
    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
